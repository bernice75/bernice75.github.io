# 사이트 설정 (수정 후 jekyll 서버 재시작 필요)
# 주의: YAML은 같은 키가 두 번 나오면 뒤쪽 값이 이깁니다. description/author 중복 정의 금지.

title: mrkim.dev
subtitle: 나의 작고 소중한 개발 블로그.
description: "김미림의 개발 블로그"
url: "https://bernice75.github.io"
baseurl: ""
lang: ko_KR

author:
  name: "김미림"

# jekyll-seo-tag
logo: /assets/img/favicon.png

social:
  name: "김미림"
  links:
    - https://github.com/bernice75

# 전역 내비게이션 링크의 유일한 출처. 페이지별로 이동 링크를 따로 두지 말 것.
# match_layout: 해당 레이아웃 페이지에서도 '현재 위치'로 표시 (포스트 상세 → Blog)
nav_links:
  - name: Home
    url: /home/
  - name: Blog
    url: /blog/
    match_layout: post
  - name: Resume
    url: /resume/
  - name: Portfolio
    url: /portfolio/

copyright_name: 김미림

# 값을 지정하면 _includes/google-analytics.html 이 활성화됩니다.
# google_tracking_id: "UA-XXXXXXXX-X"

permalink: pretty

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

# 저장소에는 두되 사이트로는 발행하지 않을 파일들
exclude:
  - .bundle
  - .gitignore
  - CONTRIBUTING.md
  - docker-compose.yml
  - docs
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - misc
  - package.json
  - README.md
  - simpol-jekyll-theme.gemspec
  - vendor

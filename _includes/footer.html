<footer>
	{% if site.nav_links.size > 0 %}
	<p class="smaller mobile-only-show">
		{% for link in site.nav_links %}{% unless forloop.first %} &bull; {% endunless %}<a href="{{ link.url | prepend: site.baseurl }}">{{ link.name }}</a>{% endfor %}
	</p>
	{% endif %}
	<p class="inline-block">&copy; {{ site.copyright_name | default: site.title }} &bull; <a href="https://simpoltheme.com?utm_source=theme&amp;utm_medium=website-footer" rel="nofollow" target="_blank" title="Minimal, free, and open source Jekyll Theme">Simpol Theme</a></p>
</footer>

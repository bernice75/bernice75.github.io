<nav class="scroll-hidden">
	<a href="{{ site.baseurl }}/home/">
		<h1>{{ site.title | default: site.github.repository_name }}</h1>
	</a>
	<p>{{ site.subtitle | default: site.github.project_tagline }}</p>
	{% if site.nav_links.size > 0 %}
	<p class="smaller mobile-hide">
		{% for link in site.nav_links %}{% unless forloop.first %} &bull; {% endunless %}<a href="{{ link.url | prepend: site.baseurl }}">{{ link.name }}</a>{% endfor %}
	</p>
	{% endif %}
</nav>

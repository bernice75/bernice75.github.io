<!DOCTYPE html>
<html lang="ko">
  {% include head.html %}
  <body{% if page.page_class %} class="{{ page.page_class }}"{% endif %}>

    {% include nav.html %}

    <div class="main">

      {{ content }}

    </div>

    <button id="scrollToTopBtn" class="scroll-to-top" type="button" aria-label="Back to top" title="Back to top">
      ⬆
    </button>

    <div id="imageLightbox" class="image-lightbox" hidden aria-hidden="true" role="dialog" aria-label="Expanded image">
      <button id="imageLightboxClose" class="image-lightbox__close" type="button" aria-label="Close image viewer">✕</button>
      <div class="image-lightbox__backdrop" data-lightbox-close></div>
      <figure class="image-lightbox__figure">
        <img id="imageLightboxImg" class="image-lightbox__img" alt="">
        <figcaption id="imageLightboxCaption" class="image-lightbox__caption" hidden></figcaption>
      </figure>
    </div>

    {% include footer.html %}

		{% include google-analytics.html %}

    <script>
      (function () {
        var scrollBtn = document.getElementById("scrollToTopBtn");
        if (!scrollBtn) return;

        function toggleButton() {
          if (window.scrollY > 200) {
            scrollBtn.classList.add("is-visible");
          } else {
            scrollBtn.classList.remove("is-visible");
          }
        }

        window.addEventListener("scroll", toggleButton, { passive: true });
        scrollBtn.addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        toggleButton();
      })();

      (function () {
        var lightbox = document.getElementById("imageLightbox");
        var lightboxImg = document.getElementById("imageLightboxImg");
        var lightboxCaption = document.getElementById("imageLightboxCaption");
        var lightboxClose = document.getElementById("imageLightboxClose");
        if (!lightbox || !lightboxImg || !lightboxCaption || !lightboxClose) return;

        var clickableImages = Array.prototype.slice.call(document.querySelectorAll("article img"));
        if (!clickableImages.length) return;

        var scrollTop = 0;

        function openLightbox(img) {
          var source = img.getAttribute("data-full-src") || img.currentSrc || img.src;
          var caption = img.getAttribute("alt") || "";

          lightboxImg.src = source;
          lightboxImg.alt = caption;

          if (caption) {
            lightboxCaption.textContent = caption;
            lightboxCaption.hidden = false;
          } else {
            lightboxCaption.textContent = "";
            lightboxCaption.hidden = true;
          }

          scrollTop = window.scrollY || document.documentElement.scrollTop || 0;
          document.body.classList.add("lightbox-open");
          document.body.style.top = "-" + scrollTop + "px";
          lightbox.hidden = false;
          lightbox.setAttribute("aria-hidden", "false");
        }

        function closeLightbox() {
          if (lightbox.hidden) return;

          lightbox.hidden = true;
          lightbox.setAttribute("aria-hidden", "true");
          lightboxImg.removeAttribute("src");
          lightboxImg.alt = "";
          document.body.classList.remove("lightbox-open");
          document.body.style.top = "";
          window.scrollTo(0, scrollTop);
        }

        clickableImages.forEach(function (img) {
          img.classList.add("lightbox-enabled-image");
          img.tabIndex = 0;
          img.setAttribute("role", "button");
          img.setAttribute("aria-label", (img.getAttribute("alt") || "Image") + " - expand");

          img.addEventListener("click", function () {
            openLightbox(img);
          });

          img.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openLightbox(img);
            }
          });
        });

        lightbox.addEventListener("click", function (event) {
          if (event.target === lightbox || event.target.hasAttribute("data-lightbox-close")) {
            closeLightbox();
          }
        });

        lightboxClose.addEventListener("click", closeLightbox);
        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            closeLightbox();
          }
        });
      })();
    </script>

  </body>
  <!-- Simpol Theme - Download at: https://simpoltheme.com/

</html>
